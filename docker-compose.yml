services:
  postgres:
    image: postgres:16
    container_name: bharatconnect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bharatconnect
      POSTGRES_USER: bharatconnect
      POSTGRES_PASSWORD: change-me-local-only
    ports:
      - "5432:5432"
    volumes:
      - bharatconnect_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bharatconnect -d bharatconnect"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  bharatconnect_pgdata:
