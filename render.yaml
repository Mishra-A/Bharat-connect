## BharatConnect — Render Blueprint
## Deploy at: dashboard.render.com → New → Blueprint → connect Mishra-A/Bharat-connect

services:
  - type: web
    name: bharatconnect-api
    runtime: python
    rootDir: backend
    pythonVersion: "3.13.5"
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 2 --timeout 60"
    healthCheckPath: /api/v1/health/
    autoDeploy: true
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true          # Render auto-generates a secure secret
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "bharat-connect-1-zseg.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://bharat-connect.vercel.app,http://localhost:5173"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://bharat-connect.vercel.app,https://bharat-connect-1-zseg.onrender.com"
      - key: ACCESS_TOKEN_MINUTES
        value: "20"
      - key: REFRESH_TOKEN_DAYS
        value: "7"
      - key: LOG_LEVEL
        value: "INFO"
      - key: DJANGO_LOG_LEVEL
        value: "WARNING"
      - key: CONN_MAX_AGE
        value: "60"
      - key: DATABASE_URL
        fromDatabase:
          name: bharatconnect-db
          property: connectionString

databases:
  - name: bharatconnect-db
    databaseName: bharatconnect
    user: bharatconnect
    plan: free
